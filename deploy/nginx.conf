# /etc/nginx/sites-available/gatewaywa
# Setelah Certbot jalan, blok listen 443 + sertifikat ditambahkan otomatis.

upstream gatewaywa_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name gatewaywa.my.id www.gatewaywa.my.id;

    client_max_body_size 10m;

    # Header keamanan dasar
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/gatewaywa.access.log;
    error_log  /var/log/nginx/gatewaywa.error.log;

    location / {
        proxy_pass http://gatewaywa_app;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://gatewaywa_app;
        access_log off;
    }
}
